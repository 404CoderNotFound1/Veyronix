name: Android CI

on:
  push:
  pull_request:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build, lint and unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest

  instrumentation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Pre-build test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Espresso instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            adb wait-for-device
            adb shell settings put global stay_on_while_plugged_in 7
            adb shell settings put system screen_off_timeout 2147483647
            adb shell locksettings set-disabled true
            adb shell wm dismiss-keyguard
            adb shell input keyevent 82
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            chmod +x gradlew && ./gradlew connectedDebugAndroidTest
